name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read
  statuses: write

jobs:
  check:
    name: Format / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Only cache daemon/shared/ctl — applet (libcosmic) is excluded from CI
          cache-all-crates: "true"
          key: ci-no-applet

      # Minimal deps: only what daemon/shared/ctl need — skip heavy libcosmic deps
      - name: Install system dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libdbus-1-dev pkg-config

      # Fast check — no compilation
      - name: Format check
        run: cargo fmt --all -- --check

      # Lint daemon/shared/ctl only (applet excluded — libcosmic takes 5+ min)
      - name: Clippy
        run: |
          cargo clippy \
            -p author-clipboard-shared \
            -p author-clipboard-daemon \
            -p author-clipboard-ctl \
            -p author-clipboard-mcp \
            -- -D warnings

      # Tests live entirely in shared crate — no system deps beyond bundled sqlite
      - name: Tests
        run: cargo test -p author-clipboard-shared

  arch-pkg:
    name: Arch PKGBUILD
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap pacman & install build deps
        run: |
          pacman -Sy --noconfirm --needed base-devel rust cargo pkgconf wayland-protocols \
            wl-clipboard sqlite libxkbcommon wayland gtk4 git gobject-introspection meson ninja valabind luajit
          # gtk4-layer-shell may not be in official repos, build from AUR if missing
          if ! pacman -Qs gtk4-layer-shell > /dev/null 2>&1; then
            useradd -m builder
            cd /tmp
            git clone https://aur.archlinux.org/gtk4-layer-shell.git
            chown -R builder:builder gtk4-layer-shell
            cd gtk4-layer-shell
            su builder -c 'makepkg --noconfirm --skippgpcheck'
            pacman --noconfirm --upgrade gtk4-layer-shell-*.pkg.tar.zst
          fi

      - name: Verify PKGBUILD parses & sources
        run: |
          cd packaging/arch
          bash -c 'source ./PKGBUILD && echo "pkgname=$pkgname pkgver=$pkgver"'

      - name: Verify PKGBUILD parses
        run: |
          cd packaging/arch
          bash -c 'source ./PKGBUILD && echo "pkgname=$pkgname pkgver=$pkgver"'

      - name: Build PKGBUILD (nocheck, nodeps — CI verification only)
        run: |
          cd packaging/arch
          export BUILDDIR=/tmp/arch-build
          export PKGDEST=/tmp/arch-dest
          mkdir -p "$BUILDDIR" "$PKGDEST"
          chown -R builder:builder "$BUILDDIR" "$PKGDEST"
          su builder -c 'makepkg --nocheck --nodeps --skippgpcheck'
          ls -la *.pkg.tar.*

