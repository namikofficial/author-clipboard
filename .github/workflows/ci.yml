name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  rust:
    name: Format / Lint / Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          key: ci-workspace

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libdbus-1-dev \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev \
            meson ninja-build pkg-config wayland-protocols

      - name: Install gtk4-layer-shell
        run: |
          set -euo pipefail
          git clone --branch v1.3.0 --depth 1 \
            https://github.com/wmww/gtk4-layer-shell.git \
            /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell \
            -Dexamples=false -Ddocs=false -Dtests=false \
            -Dsmoke-tests=false -Dintrospection=false -Dvapi=false
          meson compile -C /tmp/gtk4-layer-shell/build
          sudo meson install -C /tmp/gtk4-layer-shell/build
          sudo ldconfig

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  deb:
    name: Debian package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          key: ci-deb

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libdbus-1-dev \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev \
            dpkg-dev fakeroot meson ninja-build pkg-config wayland-protocols

      - name: Install gtk4-layer-shell
        run: |
          set -euo pipefail
          git clone --branch v1.3.0 --depth 1 \
            https://github.com/wmww/gtk4-layer-shell.git \
            /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell \
            -Dexamples=false -Ddocs=false -Dtests=false \
            -Dsmoke-tests=false -Dintrospection=false -Dvapi=false
          meson compile -C /tmp/gtk4-layer-shell/build
          sudo meson install -C /tmp/gtk4-layer-shell/build
          sudo ldconfig

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build workspace
        run: cargo build --release --workspace --locked

      - name: Build Debian package
        run: cargo deb -p author-clipboard-applet --no-build

      - name: Inspect Debian package
        run: |
          set -euo pipefail
          DEB=$(find target/debian -maxdepth 1 -name 'author-clipboard_*.deb' -print -quit)
          test -n "$DEB"
          dpkg-deb -I "$DEB"
          CONTENTS=$(dpkg-deb -c "$DEB")
          for path in \
            usr/bin/author-clipboard \
            usr/bin/author-clipboard-daemon \
            usr/bin/author-clipboard-ctl \
            usr/bin/author-clipboard-hypr-picker \
            usr/lib/systemd/user/author-clipboard-daemon.service \
            usr/share/applications/com.namikofficial.author-clipboard.desktop \
            usr/share/metainfo/com.namikofficial.author-clipboard.metainfo.xml
          do
            grep -F "$path" <<<"$CONTENTS"
          done

  arch-pkg:
    name: Arch package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: archlinux:latest
    steps:
      - name: Install Git for checkout
        shell: bash
        run: pacman -Sy --noconfirm --needed git

      - uses: actions/checkout@v4

      - name: Install package dependencies
        shell: bash
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel rust cargo pkgconf git wayland-protocols \
            wayland wl-clipboard sqlite libxkbcommon gtk4 libadwaita \
            gtk4-layer-shell gtksourceview5
          useradd -m builder

      - name: Verify SRCINFO and build package
        shell: bash
        run: |
          set -euo pipefail
          cd packaging/arch
          PKGNAME=$(sed -n 's/^pkgname=//p' PKGBUILD)
          PKGVER=$(sed -n 's/^pkgver=//p' PKGBUILD)
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git -C ../.. archive \
            --format=tar.gz \
            --prefix="$PKGNAME-$PKGVER/" \
            --output="$PWD/$PKGNAME-$PKGVER.tar.gz" \
            HEAD
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder \
            bash --noprofile --norc -c "
              set -euo pipefail
              cd '$GITHUB_WORKSPACE/packaging/arch'
              makepkg --printsrcinfo > .SRCINFO.generated
              diff -u .SRCINFO .SRCINFO.generated
              rm .SRCINFO.generated
              makepkg --noconfirm --cleanbuild --clean --skipinteg
            "
