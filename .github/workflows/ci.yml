name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read
  statuses: write

jobs:
  check:
    name: Format / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Only cache daemon/shared/ctl — applet (libcosmic) is excluded from CI
          cache-all-crates: "true"
          key: ci-no-applet

      # Minimal deps: only what daemon/shared/ctl need — skip heavy libcosmic deps
      - name: Install system dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libdbus-1-dev pkg-config

      # Fast check — no compilation
      - name: Format check
        run: cargo fmt --all -- --check

      # Lint daemon/shared/ctl only (applet excluded — libcosmic takes 5+ min)
      - name: Clippy
        run: |
          cargo clippy \
            -p author-clipboard-shared \
            -p author-clipboard-daemon \
            -p author-clipboard-ctl \
            -p author-clipboard-mcp \
            -- -D warnings

      # Tests live entirely in shared crate — no system deps beyond bundled sqlite
      - name: Tests
        run: cargo test -p author-clipboard-shared

  arch-pkg:
    name: Arch PKGBUILD
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap pacman & install build deps
        run: |
          pacman -Sy --noconfirm --needed base-devel rust cargo pkgconf wayland-protocols \
            wl-clipboard sqlite libxkbcommon wayland

      - name: Verify PKGBUILD parses & sources
        run: |
          cd packaging/arch
          # `source` (PKGBUILD) just parses and defines variables
          bash -c 'source ./PKGBUILD && echo "pkgname=$pkgname pkgver=$pkgver"'

      - name: Regenerate .SRCINFO and verify it matches
        run: |
          cd packaging/arch
          # makepkg's --printsrcinfo writes a freshly-generated .SRCINFO to stdout
          # when not run from a full package build. We re-generate and diff.
          makepkg --printsrcinfo > .SRCINFO.new
          if ! diff -u .SRCINFO .SRCINFO.new; then
            echo "::error::packaging/arch/.SRCINFO is out of sync with PKGBUILD."
            echo "Run 'makepkg --printsrcinfo > packaging/arch/.SRCINFO' to regenerate."
            exit 1
          fi
          rm -f .SRCINFO.new

      - name: Build PKGBUILD (nocheck, nodeps — CI verification only)
        run: |
          cd packaging/arch
          # Use a writable BUILDDIR under /tmp to avoid HOME/permission surprises.
          export BUILDDIR=/tmp/arch-build
          export PKGDEST=/tmp/arch-dest
          mkdir -p "$BUILDDIR" "$PKGDEST"
          makepkg --nocheck --nodeps --skippgpcheck
          # We don't install; just confirm the build produced a package.
          ls -la *.pkg.tar.*

  deb:
    name: Debian .deb build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          key: ci-deb

      - name: Install system dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libdbus-1-dev \
            libgtk-4-dev libudev-dev libinput-dev libgbm-dev \
            libseat-dev libpixman-1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config dpkg-dev

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build workspace release
        run: cargo build --release --workspace

      - name: Build .deb
        run: cargo deb -p author-clipboard-applet --no-build

      - name: Inspect .deb contents
        run: |
          DEB=$(ls target/debian/author-clipboard_*.deb | head -1)
          echo "Package: $DEB"
          dpkg-deb -I "$DEB"
          echo "--- contents ---"
          dpkg-deb -c "$DEB" | grep -E "usr/bin/author-clipboard"
