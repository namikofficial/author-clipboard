name: Release

on:
  push:
    tags:
      - "v[0-9]*"

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUSTFLAGS: "-D warnings"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag and package versions
        id: version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WORKSPACE_VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          PKGBUILD_VERSION=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          SRCINFO_VERSION=$(sed -n 's/^[[:space:]]*pkgver = //p' packaging/arch/.SRCINFO | head -1)

          test "$GITHUB_REF_NAME" = "v$WORKSPACE_VERSION"
          test "$TAG_VERSION" = "$PKGBUILD_VERSION"
          test "$TAG_VERSION" = "$SRCINFO_VERSION"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  linux-artifacts:
    name: Build Linux and Debian artifacts
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          key: release-linux

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libdbus-1-dev \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev \
            dpkg-dev fakeroot meson ninja-build pkg-config wayland-protocols

      - name: Install gtk4-layer-shell
        run: |
          set -euo pipefail
          git clone --branch v1.3.0 --depth 1 \
            https://github.com/wmww/gtk4-layer-shell.git \
            /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell \
            -Dexamples=false -Ddocs=false -Dtests=false \
            -Dsmoke-tests=false -Dintrospection=false -Dvapi=false
          meson compile -C /tmp/gtk4-layer-shell/build
          sudo meson install -C /tmp/gtk4-layer-shell/build
          sudo ldconfig

      - name: Verify workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked

      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: cargo build --release --workspace --locked

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build and inspect Debian package
        run: |
          set -euo pipefail
          cargo deb -p author-clipboard-applet --no-build
          DEB=$(find target/debian -maxdepth 1 -name 'author-clipboard_*.deb' -print -quit)
          test -n "$DEB"
          CONTENTS=$(dpkg-deb -c "$DEB")
          for path in \
            usr/bin/author-clipboard \
            usr/bin/author-clipboard-daemon \
            usr/bin/author-clipboard-ctl \
            usr/bin/author-clipboard-hypr-picker
          do
            grep -F "$path" <<<"$CONTENTS"
          done

      - name: Stage Linux artifacts
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-staging/aur
          cp target/debian/author-clipboard_*.deb release-staging/
          tar -C target/release -cJf \
            "release-staging/author-clipboard-$VERSION-linux-x86_64.tar.xz" \
            author-clipboard \
            author-clipboard-daemon \
            author-clipboard-ctl \
            author-clipboard-hypr-picker
          cp data/com.namikofficial.author-clipboard.metainfo.xml release-staging/
          cp packaging/arch/PKGBUILD packaging/arch/.SRCINFO release-staging/aur/
          tar -C release-staging/aur -czf \
            release-staging/aur/author-clipboard-aur-files.tar.gz \
            PKGBUILD .SRCINFO

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: release-staging/
          include-hidden-files: true
          if-no-files-found: error

  arch-artifact:
    name: Build Arch package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install package dependencies
        shell: bash
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel rust cargo pkgconf git wayland-protocols \
            wayland wl-clipboard sqlite libxkbcommon gtk4 libadwaita \
            gtk4-layer-shell gtksourceview5
          useradd -m builder

      - name: Verify SRCINFO and build package
        shell: bash
        run: |
          set -euo pipefail
          cd packaging/arch
          makepkg --printsrcinfo > .SRCINFO.generated
          diff -u .SRCINFO .SRCINFO.generated
          rm .SRCINFO.generated
          PKGNAME=$(sed -n 's/^pkgname=//p' PKGBUILD)
          PKGVER=$(sed -n 's/^pkgver=//p' PKGBUILD)
          git -C ../.. archive \
            --format=tar.gz \
            --prefix="$PKGNAME-$PKGVER/" \
            --output="$PWD/$PKGNAME-$PKGVER.tar.gz" \
            HEAD
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -lc \
            "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --noconfirm --cleanbuild --clean --skipinteg"

      - uses: actions/upload-artifact@v4
        with:
          name: arch-artifact
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate, linux-artifacts, arch-artifact]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release-staging

      - name: Download Arch artifact
        uses: actions/download-artifact@v4
        with:
          name: arch-artifact
          path: release-staging

      - name: Generate SHA256SUMS
        run: |
          cd release-staging
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Sign SHA256SUMS when configured
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GPG_PRIVATE_KEY is not configured; publishing unsigned checksums."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign \
            --output release-staging/SHA256SUMS.asc \
            release-staging/SHA256SUMS

      - name: Generate release notes
        uses: orhun/git-cliff-action@v3
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-staging/*.deb
            release-staging/*.pkg.tar.zst
            release-staging/*.tar.xz
            release-staging/*.xml
            release-staging/SHA256SUMS
            release-staging/SHA256SUMS.asc
            release-staging/aur/PKGBUILD
            release-staging/aur/.SRCINFO
            release-staging/aur/author-clipboard-aur-files.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
