name: Release

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: write

jobs:
  check:
    name: Check release status
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.status.outputs.version }}
      should_release: ${{ steps.status.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release status
        id: status
        run: |
          VERSION=v$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists — skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build & Release
    needs: [check]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          key: release-full

      - name: Full deps
        run: |
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libinput-dev libseat-dev \
            libgbm-dev libdbus-1-dev libudev-dev libpixman-1-dev \
            libgtk-4-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev dpkg-dev fakeroot pkg-config

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (shared/daemon/ctl/mcp)
        run: |
          cargo clippy \
            -p author-clipboard-shared \
            -p author-clipboard-daemon \
            -p author-clipboard-ctl \
            -p author-clipboard-mcp \
            -- -D warnings

      - name: Tests
        run: cargo test -p author-clipboard-shared

      - name: Set SOURCE_DATE_EPOCH
        id: sde
        run: |
          EPOCH=$(git log -1 --format=%ct "$GITHUB_REF")
          echo "epoch=$EPOCH" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$EPOCH"

      - name: Build release binaries
        env:
          SOURCE_DATE_EPOCH: ${{ steps.sde.outputs.epoch }}
        run: cargo build --release --workspace --locked

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        env:
          SOURCE_DATE_EPOCH: ${{ steps.sde.outputs.epoch }}
        run: cargo deb -p author-clipboard-applet --no-build

      - name: Stage release artifacts
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-staging
          cp target/debian/author-clipboard_*.deb release-staging/
          tar -C target/release -cJf \
            "release-staging/author-clipboard-${VERSION}-linux-x86_64.tar.xz" \
            author-clipboard \
            author-clipboard-daemon \
            author-clipboard-ctl \
            author-clipboard-hypr-picker
          cp data/com.namikofficial.author-clipboard.metainfo.xml \
            release-staging/

      - name: Generate SHA256SUMS
        working-directory: release-staging
        run: sha256sum -- *.deb *.tar.xz *.xml > SHA256SUMS

      - name: Sign SHA256SUMS with GPG (if secret is configured)
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        working-directory: release-staging
        run: |
          set -euo pipefail
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            echo "SHA256SUMS" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" --armor --detach-sign --output SHA256SUMS.asc
            gpg --armor --output SHA256SUMS.sig --detach-sign SHA256SUMS || true
            echo "Signed SHA256SUMS (detached armored signature uploaded)"
          else
            echo "GPG_PRIVATE_KEY not set; uploading SHA256SUMS without signature"
          fi

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v3
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Stage AUR source files
        run: |
          set -euo pipefail
          mkdir -p release-staging/aur
          cp packaging/arch/PKGBUILD packaging/arch/.SRCINFO release-staging/aur/
          tar -C release-staging/aur -czf release-staging/aur/author-clipboard-aur-files.tar.gz \
            PKGBUILD .SRCINFO

      - name: Upload build artifacts (debug)
        uses: actions/upload-artifact@v4
        with:
          name: release-staging
          path: release-staging/
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.check.outputs.version }}
          tag_name: ${{ needs.check.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(needs.check.outputs.version, '-') }}
          files: |
            release-staging/*.deb
            release-staging/*.tar.xz
            release-staging/SHA256SUMS
            release-staging/SHA256SUMS.asc
            release-staging/SHA256SUMS.sig
            release-staging/*.xml
            release-staging/aur/PKGBUILD
            release-staging/aur/.SRCINFO
            release-staging/aur/author-clipboard-aur-files.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  arch-pkg:
    name: Build Arch Linux .pkg.tar.zst
    needs: [release, check]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap pacman & install build deps
        run: |
          pacman -Sy --noconfirm --needed base-devel rust cargo pkgconf wayland-protocols \
            wl-clipboard sqlite libxkbcommon wayland gtk4 git
          useradd -m builder

      - name: Build gtk4-layer-shell from AUR
        run: |
          cd /tmp
          git clone https://aur.archlinux.org/gtk4-layer-shell.git
          chown -R builder:builder gtk4-layer-shell
          cd gtk4-layer-shell
          su builder -c 'makepkg --noconfirm --skippgpcheck'
          pacman --noconfirm --upgrade gtk4-layer-shell-*.pkg.tar.zst

      - name: Build Arch package
        run: |
          cd packaging/arch
          chown -R builder:builder "$PWD"
          su builder -c 'makepkg --noconfirm --skipchecksums'

      - name: Upload Arch package to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.version }}
          files: packaging/arch/*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump:
    name: Bump version for next cycle
    needs: [check, arch-pkg]
    if: always() && needs.check.outputs.should_release == 'true' && needs.arch-pkg.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Bump patch version
        run: |
          CURRENT=$(echo '${{ needs.check.outputs.version }}' | sed 's/^v//')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "Bumping $CURRENT → $NEXT"

          sed -i "s/^version = \"$CURRENT\"/version = \"$NEXT\"/" Cargo.toml
          sed -i "s/^pkgver=$CURRENT/pkgver=$NEXT/" packaging/arch/PKGBUILD
          sed -i "s/^pkgver = $CURRENT/pkgver = $NEXT/" packaging/arch/.SRCINFO

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml packaging/arch/PKGBUILD packaging/arch/.SRCINFO
          git commit -m "chore(release): bump version to $NEXT [skip ci]"
          git push
