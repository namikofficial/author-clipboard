name: Changelog

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  update-changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install git-cliff
        run: cargo install git-cliff

      - name: Generate changelog
        run: |
          git cliff --latest --strip header > CHANGELOG.md.new
          
          # Check if changelog changed
          if [ -f CHANGELOG.md ] && diff -q CHANGELOG.md CHANGELOG.md.new > /dev/null 2>&1; then
            echo "Changelog unchanged, skipping commit"
            rm CHANGELOG.md.new
          else
            echo "Changelog updated, creating commit"
            mv CHANGELOG.md.new CHANGELOG.md
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "docs(changelog): update changelog [skip ci]" || true
            git push
          fi
