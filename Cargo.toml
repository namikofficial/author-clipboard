[workspace]
resolver = "2"
members = [
    "crates/clipboard-daemon",
    "crates/applet",
    "crates/shared",
    "crates/ctl",
    "crates/hypr-picker",
    "crates/mcp-server",
    "crates/ui-gtk",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "GPL-3.0"
authors = ["Namik"]
repository = "https://github.com/namikofficial/author-clipboard"
description = "Native COSMIC clipboard manager with wlroots compositor support"
homepage = "https://github.com/namikofficial/author-clipboard"

# Clippy lint configuration (equivalent to ESLint in Node.js)
[workspace.lints.clippy]
# Correctness
correctness = { level = "deny", priority = -1 }

# Suspicious code
suspicious = { level = "warn", priority = -1 }

# Code complexity
complexity = { level = "warn", priority = -1 }

# Performance
perf = { level = "warn", priority = -1 }

# Style
style = { level = "warn", priority = -1 }

# Pedantic (opinionated but useful)
pedantic = { level = "warn", priority = -1 }

# Allow specific pedantic lints that are too noisy
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.lints.rust]
# Ensure unsafe code is explicitly opted in
unsafe_code = "warn"
# Missing docs for public items
# missing_docs = "warn"  # Enable later when API stabilizes

[workspace.dependencies]
# Shared dependencies (version managed here, used in crates)
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"

# Wayland
wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.2", features = ["client"] }
rustix = { version = "0.38", features = ["pipe"] }

# COSMIC (check for latest version)
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", default-features = false, features = [
    "winit",
    "wgpu",
    "tokio",
] }

# GTK4 UI stack (used by ui-gtk crate)
# Versions must match those used by `hypr-picker` (gtk4 0.11,
# gtk4-layer-shell 0.8) to avoid the `gtk-4` `links` conflict in cargo.
gtk4 = { version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_4"] }
gtk4-layer-shell = "0.8"
glib = "0.20"
gio = "0.20"
gdk-pixbuf = "0.20"
sourceview5 = "0.11"
webkit6 = "0.6"
glib-build-tools = "0.20"

# Image processing
image = "0.25"

# CLI
clap = { version = "4", features = ["derive"] }

# Encryption
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

# Hashing
sha2 = "0.10"

# Utilities
uuid = { version = "1", features = ["v4"] }

# MCP
mcp-spec = "0.1"
mcp-server = "0.1"
tower = "0.4"
